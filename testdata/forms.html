<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Forms</title>
</head>
<body>
  <p>Text: <input type="text" value="hello"> empty: <input> placeholder: <input placeholder="Search Wikipedia"></p>
  <p>size="10": <input size="10" value="short"> password: <input type="password" value="secret"> number: <input type="number" value="42"></p>
  <p>Buttons: <button>Save</button> <input type="submit"> <input type="reset"> <input type="button" value="Click me"> <button disabled>Disabled</button></p>
  <p>Checkboxes: <input type="checkbox"> off <input type="checkbox" checked> on &nbsp; Radios: <input type="radio" name="r"> off <input type="radio" name="r" checked> on</p>
  <p>Select: <select><option>First option</option><option selected>Second, the selected one</option><option>Third</option></select>
     and <select><option>Short</option><option>A much longer option</option></select></p>
  <p>Textarea: <textarea>Some text
on two lines</textarea> and with rows/cols: <textarea rows="3" cols="30">three rows, thirty columns</textarea></p>
  <p>Hidden: [<input type="hidden" value="x">] file: <input type="file"></p>
  <form><fieldset><legend>Fieldset</legend><label>Name <input name="n"></label> <button type="submit">Send</button></fieldset></form>
  <p>Styled: <input style="width: 300px; padding: 6px; border: 2px solid #4285f4; border-radius: 6px" placeholder="styled input">
     <button style="background: #0f9d58; color: white; border: none; padding: 6px 14px; border-radius: 4px">Styled button</button></p>
</body>
</html>
