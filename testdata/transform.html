<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Transforms</title>
  <style>
    body { font-family: sans-serif; font-size: 14px }
    .row { display: flex; gap: 48px; margin: 40px 24px }
    .b { width: 120px; height: 60px; background: #42a5f5; color: #fff; padding: 6px; border: 3px solid #0d47a1 }
    .ghost { position: relative }
    .ghost::before { content: "" }
    .stage { position: relative; width: 300px; height: 100px; background: #eee; margin: 24px }
    .centered { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #66bb6a; padding: 8px }
  </style>
</head>
<body>
  <div class="row">
    <div class="b" style="transform: translateY(20px)">translateY(20px)</div>
    <div class="b" style="transform: rotate(15deg)">rotate(15deg)</div>
    <div class="b" style="transform: scale(0.75)">scale(0.75)</div>
    <div class="b" style="transform: skewX(-15deg)">skewX(-15deg)</div>
  </div>
  <div class="row">
    <div class="b" style="transform: rotate(-90deg)">rotate(-90deg)</div>
    <div class="b" style="transform-origin: left top; transform: rotate(10deg)">origin left top</div>
    <div class="b" style="transform: translate(20px, 10px) rotate(45deg); opacity: .6">moved, turned, faded</div>
    <div class="b" style="transform: scaleX(-1)">scaleX(-1)</div>
  </div>
  <div class="stage"><div class="centered">translate(-50%, -50%)</div></div>
  <p style="margin: 24px">Icons: <img src="images/icon.svg" width="24" height="24" alt=""> and turned
    <img src="images/icon.svg" width="24" height="24" style="transform: rotate(90deg)" alt="">,
    a chevron <svg width="16" height="16" viewBox="0 0 16 16" style="transform: rotate(180deg)"><path d="M3 6l5 5 5-5" fill="none" stroke="#333" stroke-width="2"/></svg></p>
</body>
</html>
