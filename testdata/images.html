<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tobrod image test</title>
  <style>
    .wide { max-width: 100% }
    .center { text-align: center }
  </style>
</head>
<body>
  <h1>Images</h1>
  <p>Size from attributes: <img src="images/logo.png" width="64" height="64"> text next to it sits on the bottom.</p>
  <p>Only a width (height from the aspect ratio once loaded): <img src="images/photo.jpg" width="200"></p>
  <p>Natural size: <img src="images/photo.jpg"></p>
  <p class="center">Centered and linked: <a href="index.html"><img src="images/logo.png" width="32" height="32"></a></p>
  <p>Wide image limited by max-width: 100%:</p>
  <p><img class="wide" src="images/wide.png"></p>
  <p>A broken image: <img src="images/missing.png" alt="missing"> stays a placeholder.</p>
</body>
</html>
