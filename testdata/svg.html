<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SVG images</title>
</head>
<body>
  <h2>SVG as &lt;img&gt;</h2>
  <p>Shapes at their natural size (200 × 100): <img src="images/shapes.svg"></p>
  <p>The same, 100 px wide: <img src="images/shapes.svg" width="100"></p>
  <p>An icon (viewBox only), 24 px: <img src="images/icon.svg" width="24"> and 64 px: <img src="images/icon.svg" width="64" height="64"></p>
  <p>Curves (C, S, Q, T): <img src="images/curves.svg"></p>
  <p>The icon without a size: an SVG with only a viewBox has no size of its own, only an aspect ratio, so the image is as wide as the page:</p>
  <img src="images/icon.svg">
</body>
</html>
